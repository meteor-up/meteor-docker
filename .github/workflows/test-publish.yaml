name: Test-Publish
on:
  push:
    branches:
      - master
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        meteorOptions:
          - '--release=1.2.1'
          - '--release=1.3.5.1'
          - '--release=1.4.4.6'
          - '--release=1.5.4.1'
          - '--release=1.6.1.4'
          - '--release=1.7.0.5'
          - '--release=1.8.1'
          - '--release=1.9.3'
          - '--release=1.10.2'
          - '--release=1.11.1'
          - '--release=2.1.1'
          - '--release=2.2'
          - '--release=2.3.2'
          - '--release=2.4.1'
          - '--release=2.5.6'
          - '--release=2.6'
          - '--release=2.7'
          - '--release=2.8.0'
          - '--release=2.9.0'
          - '--release=2.10.0'
          - '--release=2.11.0'
          - '--release=2.12'
          - '--release=2.13.3'
          - '--release=2.14'
          - '--release=2.16'
          - '--release=3.0.4'
          - '--release=3.1.2'
          - '--release=3.2.2'
          - '--release=3.3.2'
          - '--release=3.4.1'
          # Latest version
          - 'latest'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: actions/cache@v4
        name: Meteor cache
        with:
          path: ~/.meteor
          key: ${{ runner.os }}-meteor-${{ matrix.meteorOptions }}

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install npm dependencies
        run: npm ci

      - name: Run tests
        run: |
          export PATH=$HOME/.meteor:$PATH
          export METEOR_TEST_OPTION=${{ matrix.meteorOptions }}
          npm test 


  publish:
    if: ${{ github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Install npm dependencies
        run: npm ci

      - name: Release
        run: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
